<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Oddmeister Scene</title>
  <style>
    :root{
      --textGlow: 0.35;
      --textPulse: 1;
      --smileyGlow: 1;

      /* final-10 background pulse intensity (0..1), set by JS */
      --bgPulse: 0;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: radial-gradient(circle at center, #1f1f1f 0%, #111111 70%, #0a0a0a 100%);
      font-family: Arial, sans-serif;
    }

    /* ===== Full-screen pulse aura (FINAL 10) ===== */
    .bgPulse {
      position: absolute;
      inset: -80px; /* extend to avoid edges during tiny zoom */
      pointer-events: none;
      z-index: 0; /* under embers/flames/center, but we'll use blend */
      opacity: 0;
      transform: scale(1);
      mix-blend-mode: screen;
      filter: blur(14px);
      background:
        radial-gradient(circle at 50% 45%,
          rgba(255,122,24,0.55) 0%,
          rgba(255,122,24,0.28) 26%,
          rgba(255,176,0,0.16) 44%,
          rgba(255,122,24,0.00) 72%
        );
      transition: opacity 220ms ease;
    }

    /* When finalTen is active, JS drives --bgPulse */
    body.finalTen .bgPulse{
      opacity: 1;
      /* subtle “breathing” zoom driven by the variable */
      transform: scale(calc(1 + (var(--bgPulse) * 0.035)));
    }

    /* Optional: tiny whole-scene zoom for a cinematic thump (very subtle) */
    .scene {
      position: absolute;
      inset: 0;
      transform: scale(1);
      transform-origin: 50% 45%;
      transition: transform 180ms ease;
    }
    body.finalTen .scene{
      transform: scale(calc(1 + (var(--bgPulse) * 0.008)));
    }

    /* Background ember canvas */
    #embers{
      position: absolute;
      inset: 0;
      width: 1920px;
      height: 1080px;
      pointer-events: none;
      z-index: 1;
    }

    .flames {
      position: absolute;
      inset: 0;
      background: url("assets/flame.png") center/cover no-repeat;
      animation: flicker 3s infinite ease-in-out;
      mix-blend-mode: screen;
      opacity: 0.7;
      pointer-events: none;
      z-index: 2;
    }

    @keyframes flicker {
      0%, 100% { transform: scale(1); opacity: 0.7; }
      50% { transform: scale(1.05); opacity: 0.9; }
    }

    .center {
      position: absolute;
      width: 100%;
      top: 40%;
      text-align: center;
      color: #ff9a00;
      pointer-events: none;
      z-index: 3;
    }

    /* ===== Smiley + Halo ===== */
    .smileyWrap{
      position: relative;
      width: 200px;
      height: 200px;
      margin: 0 auto 12px;
      display: grid;
      place-items: center;
    }

    .halo{
      position: absolute;
      inset: -40px;
      border-radius: 50%;
      opacity: 0;
      transform: scale(0.2);
      pointer-events: none;
      mix-blend-mode: screen;
      background: radial-gradient(circle,
        rgba(255,255,255,0.85) 0%,
        rgba(255,176,0,0.65) 28%,
        rgba(255,122,24,0.45) 52%,
        rgba(255,122,24,0.0) 76%
      );
      filter: blur(8px);
    }

    .smiley{
      width: 200px;
      height: 200px;
      object-fit: contain;
      filter: drop-shadow(0 0 30px rgba(255,122,24,0.7));
      transition: filter 300ms ease;
      animation: idlePulse 4s infinite ease-in-out;
      display: block;
      z-index: 2;
    }

    @keyframes idlePulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }

    /* Full moment: halo burst + smiley pop */
    .smileyWrap.fullMoment .halo{
      animation: haloBurst 900ms cubic-bezier(0.18,0.89,0.32,1.28) forwards;
    }

    .smileyWrap.fullMoment .smiley{
      animation: smileyPop 650ms cubic-bezier(0.18,0.89,0.32,1.28) forwards;
      filter:
        drop-shadow(0 0 40px rgba(255,255,255,0.75))
        drop-shadow(0 0 90px rgba(255,122,24,0.75));
    }

    @keyframes haloBurst{
      0%   { opacity: 0.95; transform: scale(0.25); }
      40%  { opacity: 1;    transform: scale(1.35); }
      70%  { opacity: 0.6;  transform: scale(1.9); }
      100% { opacity: 0;    transform: scale(2.35); }
    }

    @keyframes smileyPop{
      0%   { transform: scale(1); }
      35%  { transform: scale(1.18); }
      65%  { transform: scale(0.98); }
      100% { transform: scale(1.05); }
    }

    /* Title */
    h1 {
      margin: 10px 0 0;
      font-size: 60px;
      letter-spacing: 5px;
    }

    #modeText{
      text-shadow:
        0 0 18px rgba(255, 122, 24, calc(var(--textGlow) * 0.55)),
        0 0 55px rgba(255, 122, 24, calc(var(--textGlow) * 0.25));
      transform: scale(var(--textPulse));
      transition: text-shadow 200ms linear, transform 200ms linear, color 200ms linear;
    }

    body.lastMinute #modeText{
      animation: textBreath 1.2s infinite ease-in-out;
    }

    @keyframes textBreath{
      0%,100% { filter: brightness(1); }
      50%     { filter: brightness(1.15); }
    }

    body.lastMinute .smiley{
      animation: smileyHappy 1.0s infinite ease-in-out;
      filter: drop-shadow(0 0 40px rgba(255,122,24, calc(0.55 * var(--smileyGlow))));
    }

    @keyframes smileyHappy{
      0%,100% { transform: translateY(0) rotate(0deg) scale(1); }
      35%     { transform: translateY(-8px) rotate(-2deg) scale(1.03); }
      70%     { transform: translateY(0) rotate(2deg) scale(1.01); }
    }

    /* Countdown */
    .countdown {
      margin-top: 12px;
      font-size: 44px;
      font-weight: 800;
      letter-spacing: 4px;
      color: rgba(255, 255, 255, 0.92);
      text-shadow:
        0 0 18px rgba(255, 122, 24, 0.45),
        0 0 50px rgba(255, 122, 24, 0.20);
    }

    /* LET'S GO pop */
    .goLivePop {
      color: #ffffff !important;
      animation: popIn 0.6s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
      text-shadow:
        0 0 25px rgba(255, 255, 255, 0.8),
        0 0 60px rgba(255, 122, 24, 0.6);
    }

    @keyframes popIn {
      0%   { transform: scale(0.7); opacity: 0; }
      60%  { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(1); }
    }

    /* ===== Molten Fuse Progress Bar (back to normal) ===== */
    .meterWrap{
      width: 680px;
      margin: 18px auto 0;
      position: relative;
      transition: opacity 350ms ease, transform 350ms ease;
    }

    .meterWrap.hidden{
      opacity: 0;
      transform: translateY(10px) scale(0.98);
    }

    .meterBloom{
      position: absolute;
      left: 50%;
      top: -28px;
      transform: translateX(-50%);
      width: calc(100% + 120px);
      height: 88px;
      border-radius: 999px;
      background: radial-gradient(circle at 50% 55%,
        rgba(255,122,24,0.00) 0%,
        rgba(255,122,24,0.00) 35%,
        rgba(255,122,24,0.18) 60%,
        rgba(255,122,24,0.00) 78%
      );
      filter: blur(10px);
      opacity: 0;
      pointer-events: none;
      mix-blend-mode: screen;
    }

    .meter{
      position: relative;
      width: 100%;
      height: 18px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(255,255,255,0.08);
      box-shadow:
        inset 0 0 0 1px rgba(255,122,24,0.18),
        inset 0 10px 24px rgba(0,0,0,0.55);
    }

    .meterFill{
      position: absolute;
      inset: 0;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg,
        rgba(255,122,24,0.85),
        rgba(255,176,0,0.95),
        rgba(255,245,230,0.85)
      );
      box-shadow:
        0 0 18px rgba(255,122,24,0.40),
        0 0 45px rgba(255,122,24,0.18);
      transform: translateZ(0);
      transition: width 120ms linear;
    }

    .meterHotCore{
      position: absolute;
      inset: 0;
      border-radius: 999px;
      opacity: 0;
      background: linear-gradient(90deg,
        rgba(255,255,255,0.00),
        rgba(255,255,255,0.22),
        rgba(255,255,255,0.00)
      );
      mix-blend-mode: screen;
      filter: blur(1px);
      pointer-events: none;
    }

    .meterEdge{
      position: absolute;
      top: 0;
      bottom: 0;
      width: 36px;
      left: 0;
      transform: translateX(-18px);
      background: radial-gradient(circle at 30% 50%,
        rgba(255,255,255,0.55),
        rgba(255,176,0,0.25),
        rgba(255,122,24,0)
      );
      opacity: 0;
      pointer-events: none;
      mix-blend-mode: screen;
    }

    .meterShine{
      position: absolute;
      inset: -40px 0;
      background: linear-gradient(120deg,
        rgba(255,255,255,0) 0%,
        rgba(255,255,255,0.12) 45%,
        rgba(255,255,255,0.0) 70%
      );
      transform: translateX(-80%);
      opacity: 0.0;
      pointer-events: none;
    }

    /* Last minute base */
    body.lastMinute .meterFill{
      box-shadow:
        0 0 24px rgba(255,122,24,0.65),
        0 0 75px rgba(255,122,24,0.25);
      animation: heatPulse 1.2s ease-in-out infinite;
    }

    body.lastMinute .meterShine{
      opacity: 1;
      animation: shineSweep 1.6s linear infinite;
    }

    body.lastMinute .meterEdge{
      opacity: 1;
    }

    @keyframes heatPulse{
      0%,100%{ filter: brightness(1); }
      50%    { filter: brightness(1.15); }
    }

    @keyframes shineSweep{
      0%   { transform: translateX(-80%); }
      100% { transform: translateX(120%); }
    }

    /* Optional (kept): last 10 seconds overcharge for the bar (clean white-hot) */
    body.overcharge .meterBloom{
      opacity: 1;
      animation: bloomPulse 0.55s ease-in-out infinite;
    }

    @keyframes bloomPulse{
      0%,100%{ transform: translateX(-50%) scale(1); opacity: 0.75; }
      50%    { transform: translateX(-50%) scale(1.06); opacity: 1; }
    }

    body.overcharge .meterFill{
      filter: brightness(1.28) saturate(1.15);
      box-shadow:
        0 0 30px rgba(255,122,24,0.95),
        0 0 110px rgba(255,122,24,0.35);
      animation: overchargeThump 0.35s ease-in-out infinite;
    }

    @keyframes overchargeThump{
      0%,100% { transform: scaleY(1); }
      50%     { transform: scaleY(1.18); }
    }

    body.overcharge .meterShine{
      opacity: 1;
      animation: shineSweep 0.75s linear infinite;
    }

    body.overcharge .meterHotCore{
      opacity: 1;
      animation: hotCoreDrift 0.55s linear infinite;
    }

    @keyframes hotCoreDrift{
      0%   { transform: translateX(-40%); }
      100% { transform: translateX(40%); }
    }
  </style>
</head>

<body>
  <div class="bgPulse"></div>
  <div class="scene">
    <canvas id="embers"></canvas>
    <div class="flames"></div>

    <div class="center">
      <div id="smileyWrap" class="smileyWrap">
        <div class="halo"></div>
        <img id="smileyImg" src="assets/Smiley.png" class="smiley" alt="Smiley">
      </div>

      <h1 id="modeText">STARTING SOON</h1>

      <div id="meterWrap" class="meterWrap">
        <div class="meterBloom"></div>

        <div class="meter">
          <div id="meterFill" class="meterFill"></div>
          <div class="meterHotCore"></div>
          <div id="meterEdge" class="meterEdge"></div>
          <div class="meterShine"></div>
        </div>

        <div id="countdown" class="countdown">00:00</div>
      </div>
    </div>
  </div>

<script>
const COUNTDOWN_MINUTES = 0.20; // test
const SMILEY_NORMAL = "assets/Smiley.png";
const SMILEY_HAPPY  = "assets/Smiley_Happy.png";
const GO_LIVE_TEXT  = "LET'S GO!";

const BASE_W = 1920;
const BASE_H = 1080;

const EMBER_COUNT = 110;
const VY_MIN = 18;
const VY_MAX = 55;
const VX_MAX = 14;
const EMBER_SPEED_MULT_MAX = 2.0;

const SPARK_BURST_COUNT = 260;

const countdownEl = document.getElementById("countdown");
const textEl = document.getElementById("modeText");
const smileyImg = document.getElementById("smileyImg");
const smileyWrap = document.getElementById("smileyWrap");
const meterFill = document.getElementById("meterFill");
const meterEdge = document.getElementById("meterEdge");
const meterWrap = document.getElementById("meterWrap");

const emberCanvas = document.getElementById("embers");
const emberCtx = emberCanvas.getContext("2d");
emberCanvas.width = BASE_W;
emberCanvas.height = BASE_H;
emberCanvas.style.width = "100%";
emberCanvas.style.height = "100%";

function clamp01(x){ return Math.max(0, Math.min(1, x)); }
function smoothstep(t){ t = clamp01(t); return t*t*(3-2*t); }
function lerp(a,b,t){ return a + (b-a)*t; }

function formatTime(sec){
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
}

const startSeconds = COUNTDOWN_MINUTES * 60;
const endTime = Date.now() + startSeconds * 1000;

const HYPE_THRESHOLD = Math.min(60, startSeconds);
const FINAL_TEN = Math.min(10, startSeconds);

let triggeredHype = false;
let wentLive = false;
let displayFill = 0;

const embers = [];
for (let i = 0; i < EMBER_COUNT; i++){
  embers.push({
    x: Math.random() * BASE_W,
    y: Math.random() * BASE_H,
    r: Math.random() * 1.8 + 0.6,
    vy: lerp(VY_MIN, VY_MAX, Math.random()),
    vx: (Math.random() * 2 - 1) * VX_MAX,
    a: Math.random() * 0.55 + 0.25
  });
}

let sparks = [];
let sparksActive = false;

function spawnExplosion(){
  sparksActive = true;
  sparks = [];
  for (let i = 0; i < SPARK_BURST_COUNT; i++){
    const ang = Math.random() * Math.PI * 2;
    const spd = 220 + Math.random() * 920;
    sparks.push({
      x: Math.random() * BASE_W,
      y: Math.random() * BASE_H,
      vx: Math.cos(ang) * spd,
      vy: Math.sin(ang) * spd,
      life: 0.6 + Math.random() * 0.9,
      age: 0,
      size: 0.8 + Math.random() * 2.2
    });
  }
}

function triggerFullMoment(){
  if (!smileyWrap) return;
  smileyWrap.classList.remove("fullMoment");
  void smileyWrap.offsetWidth;
  smileyWrap.classList.add("fullMoment");
}

let last = performance.now();

function loop(now){
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;

  const remaining = Math.max(0, Math.ceil((endTime - Date.now()) / 1000));
  countdownEl.textContent = formatTime(remaining);

  const elapsed = startSeconds - remaining;
  const progress = clamp01(elapsed / startSeconds);

  const targetFill = smoothstep(progress);
  displayFill = lerp(displayFill, targetFill, 0.12);

  const pct = clamp01(displayFill) * 100;
  meterFill.style.width = `${pct.toFixed(3)}%`;

  const edgeX = (pct / 100) * 680;
  meterEdge.style.left = `${edgeX}px`;

  // last minute mode (text/smiley vibe)
  if (remaining <= HYPE_THRESHOLD && remaining > 0){
    document.body.classList.add("lastMinute");
  } else {
    document.body.classList.remove("lastMinute");
  }

  // last 10 seconds: background pulse (and optional bar overcharge)
  if (remaining <= FINAL_TEN && remaining > 0){
    document.body.classList.add("finalTen");
    document.body.classList.add("overcharge"); // keep bar clean-hot; remove if you want zero bar change
  } else {
    document.body.classList.remove("finalTen");
    document.body.classList.remove("overcharge");
  }

  // drive background pulse intensity (0..1)
  // 10s remaining -> 0, 0s -> 1
  const tenProgress = clamp01((FINAL_TEN - remaining) / FINAL_TEN);
  const tenEased = smoothstep(tenProgress);

  // make it “breathy” using a sine, with increasing intensity toward 0
  const breath = (Math.sin(now * 0.010) * 0.5 + 0.5); // 0..1
  const pulse = lerp(0.15, 1.0, tenEased) * lerp(0.35, 1.0, breath);

  document.documentElement.style.setProperty("--bgPulse", String(pulse));

  // smiley swap at hype start
  if (!triggeredHype && remaining === HYPE_THRESHOLD){
    triggeredHype = true;
    smileyImg.src = SMILEY_HAPPY;
  }
  if (remaining > HYPE_THRESHOLD){
    triggeredHype = false;
    smileyImg.src = SMILEY_NORMAL;
  }

  // ramp for text glow + ember speed
  const lastMinuteProgress = clamp01((HYPE_THRESHOLD - remaining) / HYPE_THRESHOLD);
  const eased = smoothstep(lastMinuteProgress);

  const glow = lerp(0.30, 1.00, eased);
  const pulseScale = lerp(1.00, 1.06, eased);
  const smileyGlow = lerp(1.0, 1.4, eased);

  document.documentElement.style.setProperty("--textGlow", String(glow));
  document.documentElement.style.setProperty("--textPulse", String(pulseScale));
  document.documentElement.style.setProperty("--smileyGlow", String(smileyGlow));

  // background embers
  emberCtx.fillStyle = "rgba(0,0,0,0.22)";
  emberCtx.fillRect(0,0,BASE_W,BASE_H);

  const emberSpeed = lerp(1.0, EMBER_SPEED_MULT_MAX, eased);

  for (const p of embers){
    p.y -= (p.vy * emberSpeed) * dt;
    p.x += (p.vx * emberSpeed) * dt;

    if (p.y < -10) p.y = BASE_H + 10;
    if (p.x < -10) p.x = BASE_W + 10;
    if (p.x > BASE_W + 10) p.x = -10;

    emberCtx.fillStyle = `rgba(255,140,0,${p.a})`;
    emberCtx.beginPath();
    emberCtx.arc(p.x, p.y, p.r, 0, Math.PI*2);
    emberCtx.fill();

    emberCtx.fillStyle = `rgba(255,220,170,${p.a * 0.35})`;
    emberCtx.beginPath();
    emberCtx.arc(p.x + 0.8, p.y - 0.8, p.r * 0.55, 0, Math.PI*2);
    emberCtx.fill();
  }

  // explosion sparkles
  if (sparksActive){
    for (const s of sparks){
      s.age += dt;
      s.x += s.vx * dt;
      s.y += s.vy * dt;

      s.vy += 160 * dt;

      s.vx *= Math.pow(0.22, dt);
      s.vy *= Math.pow(0.22, dt);

      const t = clamp01(1 - s.age / s.life);
      const a = t * 0.95;

      emberCtx.fillStyle = `rgba(255,235,200,${a})`;
      emberCtx.beginPath();
      emberCtx.arc(s.x, s.y, s.size * (0.6 + t), 0, Math.PI*2);
      emberCtx.fill();
    }

    sparks = sparks.filter(s => s.age < s.life);
    if (sparks.length === 0) sparksActive = false;
  }

  // go live at 0
  if (remaining <= 0 && !wentLive){
    wentLive = true;

    textEl.textContent = GO_LIVE_TEXT;
    textEl.classList.add("goLivePop");
    countdownEl.style.display = "none";

    meterFill.style.width = "100%";
    meterFill.style.filter = "brightness(1.35)";
    meterEdge.style.opacity = "0";

    triggerFullMoment();
    spawnExplosion();
    meterWrap.classList.add("hidden");

    // clear modes
    document.body.classList.remove("lastMinute");
    document.body.classList.remove("finalTen");
    document.body.classList.remove("overcharge");
    document.documentElement.style.setProperty("--bgPulse", "0");
  }

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
