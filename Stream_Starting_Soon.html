<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,height=device-height,initial-scale=1" />
<title>Oddmeister • Corner Dock</title>
<style>
  :root{
    --orange:#ff7a18;
    --orange2:#ffb000;
    --cream:#ffe9d2;

    /* not-black base */
    --bg1:#141833;
    --bg2:#281536;
    --bg3:#0f2f36;

    --dockBg: rgba(255,255,255,0.06);
    --dockBorder: rgba(255,255,255,0.14);
    --dockText: rgba(255,255,255,0.88);
    --dockSub: rgba(255,233,210,0.70);

    --dockRadius: 24px;
  }

  html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
  }

  .stage{
    position:relative;
    width:100%;
    height:100%;
    background:
      radial-gradient(1100px 850px at 18% 20%, rgba(255,122,24,0.16), transparent 62%),
      radial-gradient(900px 700px at 82% 28%, rgba(255,176,0,0.10), transparent 62%),
      radial-gradient(1200px 900px at 55% 85%, rgba(120,80,255,0.10), transparent 65%),
      linear-gradient(135deg, var(--bg1), var(--bg2) 48%, var(--bg3));
  }

  /* Slow “fog” drift overlay (super subtle) */
  .fog{
    position:absolute; inset:-18%;
    background:
      radial-gradient(900px 700px at 25% 35%, rgba(255,122,24,0.12), transparent 65%),
      radial-gradient(900px 700px at 70% 55%, rgba(255,176,0,0.08), transparent 66%),
      radial-gradient(900px 700px at 55% 25%, rgba(120,80,255,0.10), transparent 70%);
    filter: blur(22px);
    opacity: 0.9;
    animation: fogDrift 10s ease-in-out infinite alternate;
    pointer-events:none;
    mix-blend-mode: screen;
  }
  @keyframes fogDrift{
    0%{ transform: translate(-18px, 12px) scale(1.02); }
    100%{ transform: translate(18px, -14px) scale(1.06); }
  }

  /* Embers across entire canvas (but light) */
  #embers{
    position:absolute; inset:0;
    width:100%; height:100%;
    pointer-events:none;
    mix-blend-mode: screen;
    opacity: 0.95;
  }

  /* Vignette keeps edges calm */
  .vignette{
    position:absolute; inset:0;
    background: radial-gradient(1200px 900px at 50% 50%, transparent 52%, rgba(0,0,0,0.22) 80%, rgba(0,0,0,0.48) 100%);
    pointer-events:none;
  }

  /* --- Corner Dock UI --- */
  .dock{
    position:absolute;
    left: clamp(18px, 2.2vw, 44px);
    bottom: clamp(18px, 2.2vw, 44px);
    display:flex;
    align-items:center;
    gap: 16px;
    padding: 14px 16px;
    border-radius: var(--dockRadius);
    background: var(--dockBg);
    border: 1px solid var(--dockBorder);
    box-shadow: 0 24px 90px rgba(0,0,0,0.38);
    backdrop-filter: blur(12px);
    transform: translateZ(0);
  }

  .badge{
    width: 56px;
    height: 56px;
    border-radius: 16px;
    display:grid;
    place-items:center;
    position:relative;
    overflow:hidden;
  }

  /* Warm accent behind badge */
  .badge:before{
    content:"";
    position:absolute; inset:-60%;
    background:
      radial-gradient(circle at 35% 40%, rgba(255,122,24,0.45), transparent 62%),
      radial-gradient(circle at 70% 70%, rgba(255,176,0,0.22), transparent 65%);
    filter: blur(10px);
    opacity: 0.95;
    animation: badgeDrift 5.8s ease-in-out infinite alternate;
  }
  @keyframes badgeDrift{
    0%{ transform: translate(-10px, 8px) scale(1.02); }
    100%{ transform: translate(10px, -8px) scale(1.08); }
  }

  .smiley{
    width: 44px;
    height: 44px;
    z-index:2;
    filter: drop-shadow(0 10px 22px rgba(0,0,0,0.35));
  }

  .text{
    display:flex;
    flex-direction:column;
    gap: 2px;
    min-width: 240px;
  }

  .title{
    font-weight: 950;
    letter-spacing: 0.02em;
    color: var(--dockText);
    font-size: 16px;
    line-height: 1.2;
    display:flex;
    align-items:center;
    gap: 10px;
  }

  .dot{
    width: 8px; height: 8px;
    border-radius: 999px;
    background: var(--orange);
    box-shadow: 0 0 14px rgba(255,122,24,0.65);
  }

  .sub{
    color: var(--dockSub);
    font-weight: 800;
    letter-spacing: 0.10em;
    text-transform: uppercase;
    font-size: 12px;
  }

  .timer{
    margin-left: 10px;
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap: 2px;
    min-width: 110px;
  }

  .time{
    font-variant-numeric: tabular-nums;
    font-size: 26px;
    font-weight: 950;
    color: rgba(255,255,255,0.92);
    letter-spacing: 0.02em;
    line-height: 1.05;
  }
  .state{
    font-size: 12px;
    font-weight: 850;
    color: rgba(255,233,210,0.72);
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  /* Last 10 seconds: warm wash + dock pulse */
  .heat{
    position:absolute; inset:0;
    background: radial-gradient(900px 700px at 30% 85%, rgba(255,122,24,0.18), transparent 62%);
    opacity: 0;
    pointer-events:none;
    mix-blend-mode: screen;
  }

  .last10 .heat{
    opacity: 1;
    animation: heatPulse 0.9s ease-in-out infinite;
  }
  @keyframes heatPulse{
    0%{ opacity: .10; transform: scale(1); }
    50%{ opacity: .26; transform: scale(1.02); }
    100%{ opacity: .10; transform: scale(1); }
  }

  .last10 .dock{
    animation: dockPulse 0.9s ease-in-out infinite;
    border-color: rgba(255,122,24,0.32);
  }
  @keyframes dockPulse{
    0%{ transform: translateZ(0) scale(1); }
    50%{ transform: translateZ(0) scale(1.02); }
    100%{ transform: translateZ(0) scale(1); }
  }

  /* Make sure it still looks good if the Browser Source is not exactly 1920x1080 */
  .safe{
    position:absolute; inset:0;
    pointer-events:none;
  }
</style>
</head>
<body>
  <div class="stage" id="root">
    <div class="fog"></div>
    <canvas id="embers"></canvas>
    <div class="vignette"></div>
    <div class="heat"></div>

    <div class="dock">
      <div class="badge">
        <img class="smiley" src="assets/smiley.png" alt="Smiley"/>
      </div>

      <div class="text">
        <div class="title"><span class="dot"></span> Oddmeister • Starting Soon</div>
        <div class="sub">loading vibes…</div>
      </div>

      <div class="timer">
        <div class="time" id="time">05:00</div>
        <div class="state" id="state">warming up</div>
      </div>
    </div>

    <div class="safe"></div>
  </div>

<script>
  // -------- Countdown --------
  const root = document.getElementById("root");
  const timeEl = document.getElementById("time");
  const stateEl = document.getElementById("state");

  let totalStart = 5 * 60; // change me
  let total = totalStart;

  const fmt = (s) => {
    const m = Math.floor(s/60);
    const r = s%60;
    return String(m).padStart(2,"0") + ":" + String(r).padStart(2,"0");
  };

  function tick(){
    timeEl.textContent = fmt(total);

    if (total <= 10){
      root.classList.add("last10");
      stateEl.textContent = "lock in…";
    } else {
      root.classList.remove("last10");
      stateEl.textContent = "warming up";
    }

    total = Math.max(0, total - 1);
    if (total === 0){
      stateEl.textContent = "go time";
      clearInterval(timer);
    }
  }
  tick();
  const timer = setInterval(tick, 1000);

  // -------- Embers (OBS-safe) --------
  const canvas = document.getElementById("embers");
  const ctx = canvas.getContext("2d", { alpha:true });

  let W=0,H=0,DPR=1;

  function resize(){
    const rect = canvas.getBoundingClientRect();
    DPR = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
    W = Math.floor(rect.width);
    H = Math.floor(rect.height);
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }

  const ro = new ResizeObserver(resize);
  ro.observe(canvas);
  window.addEventListener("load", resize);

  const embers=[];
  const MAX=120;
  const rand=(a,b)=>a+Math.random()*(b-a);

  function spawn(){
    const hotspot = Math.random()<0.55;
    const x = hotspot ? (W*0.45 + rand(-320,320)) : rand(0,W);
    const y = rand(H*0.72, H+50);
    const r = rand(1.0, 3.2);
    const vy = -rand(0.7, 2.3);
    const vx = rand(-0.32, 0.32);
    const life = rand(120, 260);
    const hue = rand(22, 48);
    const sat = rand(85, 100);
    const light = rand(54, 72);
    const alpha = rand(0.16, 0.60);
    embers.push({x,y,vx,vy,r,life,t:0,hue,sat,light,alpha,tw:rand(0.6,1.8)});
  }

  function ensure(){ while(embers.length<MAX) spawn(); }
  ensure();

  function draw(){
    if(!W||!H){ requestAnimationFrame(draw); return; }
    ctx.clearRect(0,0,W,H);

    // subtle bottom heat tint
    const g = ctx.createRadialGradient(W*0.5, H*0.95, 10, W*0.5, H*0.95, Math.max(W,H)*0.65);
    g.addColorStop(0,"rgba(255,122,24,0.10)");
    g.addColorStop(0.35,"rgba(255,176,0,0.05)");
    g.addColorStop(1,"rgba(255,176,0,0)");
    ctx.fillStyle=g;
    ctx.fillRect(0,0,W,H);

    for(let i=embers.length-1;i>=0;i--){
      const e=embers[i];
      e.t++;
      e.x += e.vx + Math.sin((e.t/18)*e.tw)*0.22;
      e.y += e.vy;
      e.vx *= 0.998;

      const k = 1 - (e.t/e.life);
      const a = Math.max(0, e.alpha*k);
      const rr = e.r*(0.9+(1-k)*0.25);

      ctx.beginPath();
      ctx.fillStyle = `hsla(${e.hue},${e.sat}%,${e.light}%,${a})`;
      ctx.arc(e.x,e.y,rr,0,Math.PI*2);
      ctx.fill();

      ctx.beginPath();
      ctx.fillStyle = `hsla(${e.hue},${e.sat}%,${Math.min(92,e.light+18)}%,${a*0.55})`;
      ctx.arc(e.x,e.y,rr*2.1,0,Math.PI*2);
      ctx.fill();

      if(e.t>e.life || e.y<-70 || e.x<-90 || e.x>W+90){
        embers.splice(i,1);
      }
    }

    ensure();
    requestAnimationFrame(draw);
  }
  draw();
</script>
</body>
</html>
