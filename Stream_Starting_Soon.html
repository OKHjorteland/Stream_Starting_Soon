<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Oddmeister Scene</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="flames"></div>
  <canvas id="embers"></canvas>

  <div class="center">
    <img src="assets/smiley.png" class="smiley">
    <h1 id="modeText">STARTING SOON</h1>
    <div id="countdown" class="countdown">00:00</div>
  </div>

  <script src="script.js"></script>

  


  <style>
    body {
  margin: 0;
  overflow: hidden;
  background: radial-gradient(circle at center, #1f1f1f 0%, #111111 70%, #0a0a0a 100%);
  font-family: Arial, sans-serif;
}

html, body {
  margin: 0;
  padding: 0;
  width: 1920px;
  height: 1080px;
  overflow: hidden;
}

.flames {
  position: absolute;
  width: 100%;
  height: 100%;
  background: url("assets/flame.png") center/cover no-repeat;
  animation: flicker 3s infinite ease-in-out;
  mix-blend-mode: screen;
  opacity: 0.7;
}

@keyframes flicker {
  0%, 100% { transform: scale(1); opacity: 0.7; }
  50% { transform: scale(1.05); opacity: 0.9; }
}

.center {
  position: absolute;
  width: 100%;
  top: 40%;
  text-align: center;
  color: #ff9a00;
}

.smiley {
  width: 200px;
  animation: pulse 4s infinite ease-in-out;
  filter: drop-shadow(0 0 30px #ff7a18);
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.08); }
}

h1 {
  margin-top: 20px;
  font-size: 60px;
  letter-spacing: 5px;
}

.countdown {
  margin-top: 10px;
  font-size: 44px;
  font-weight: 800;
  letter-spacing: 4px;
  color: rgba(255, 255, 255, 0.92);
  text-shadow:
    0 0 18px rgba(255, 122, 24, 0.45),
    0 0 50px rgba(255, 122, 24, 0.20);
}
  </style>



<script>

const canvas = document.getElementById("embers");
const ctx = canvas.getContext("2d");

const W = 1920;
const H = 1080;

canvas.width = W;
canvas.height = H;
canvas.style.width = "100%";
canvas.style.height = "100%";

let particles = [];
const COUNT = 120;

for (let i = 0; i < COUNT; i++) {
  particles.push({
    x: Math.random() * W,
    y: Math.random() * H,
    r: Math.random() * 2.5 + 0.5,
    vy: Math.random() * 60 + 30, // pixels per second (30–90)
    vx: (Math.random() - 0.5) * 20 // drift left/right (px/s)
  });
}

let last = performance.now();

function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); // seconds, capped
  last = now;

  ctx.clearRect(0, 0, W, H);

  ctx.fillStyle = "rgba(255,140,0,0.8)";
  for (const p of particles) {
    p.y -= p.vy * dt;
    p.x += p.vx * dt;

    // wrap around
    if (p.y < -10) p.y = H + 10;
    if (p.x < -10) p.x = W + 10;
    if (p.x > W + 10) p.x = -10;

    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
  }

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);

// ===== Starting Soon Countdown (duration-based) =====
const COUNTDOWN_MINUTES = 5; // <-- change this
let remaining = COUNTDOWN_MINUTES * 60;

const countdownEl = document.getElementById("countdown");

function formatTime(sec) {
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
}

function tick() {
  countdownEl.textContent = formatTime(remaining);

  if (remaining <= 0) {
    countdownEl.textContent = "LIVE SOON!";
    // Optional: little visual cue
    countdownEl.classList.add("countdown-done");
    return;
  }
  remaining -= 1;
  setTimeout(tick, 1000);
}

tick();
</script>
</body>
</html>
